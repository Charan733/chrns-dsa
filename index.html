<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHRNS-DSA — Sign In</title>
<meta name="description" content="Sign in to CHRNS-DSA to track your competitive coding contests and DSA sheet mastery.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070F;--surface:rgba(13,19,36,.72);--input:#0B1122;--border:rgba(148,163,255,.14);--border-active:rgba(34,211,238,.55);--text:#F1F5FF;--muted:#8B98B8;--primary:#22D3EE;--secondary:#818CF8;--danger:#F87171;--radius:16px;--ease:cubic-bezier(.22,1,.36,1);--font:'Inter',system-ui,sans-serif;--display:'Space Grotesk','Inter',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;
background-image:linear-gradient(rgba(129,140,248,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(129,140,248,.045) 1px,transparent 1px),radial-gradient(55% 45% at 85% 0,rgba(99,102,241,.2),transparent 70%),radial-gradient(45% 40% at 5% 15%,rgba(34,211,238,.13),transparent 70%);background-size:56px 56px,56px 56px,100% 100%,100% 100%}
.shell{width:min(960px,100%);display:grid;grid-template-columns:1.05fr 1fr;border:1px solid var(--border);border-radius:24px;background:var(--surface);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(2,6,23,.6);overflow:hidden;animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.visual{position:relative;padding:40px;display:flex;flex-direction:column;justify-content:space-between;min-height:520px;border-right:1px solid var(--border);background:radial-gradient(70% 60% at 30% 30%,rgba(34,211,238,.09),transparent 70%)}
.brand{display:flex;align-items:center;gap:10px;font:700 18px var(--display);letter-spacing:-.01em}
.brand i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;font:600 13px var(--mono);font-style:normal;color:var(--primary);background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.35)}
.graph{position:absolute;inset:80px 20px 110px;perspective:800px}
.graph svg{width:100%;height:100%;transform:rotateX(14deg) rotateY(-12deg);transform-origin:center;animation:sway 14s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotateX(8deg) rotateY(10deg)}}
.graph line{stroke:rgba(129,140,248,.4);stroke-width:1.2}
.graph circle{fill:#0D1324;stroke:var(--primary);stroke-width:1.6}
.graph circle.b{stroke:var(--secondary)}
.graph text{font:500 10px var(--mono);fill:var(--muted)}
.visual h2{position:relative;font:700 28px/1.15 var(--display);letter-spacing:-.02em}
.visual h2 span{background:linear-gradient(120deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}
.visual p{position:relative;margin-top:10px;color:var(--muted);font-size:14px}
.panel{padding:44px 40px;display:flex;flex-direction:column;justify-content:center}
h1{font:700 26px var(--display);letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:6px 0 26px}
.field{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px;letter-spacing:.02em}
.control{position:relative}
.control input{width:100%;height:46px;padding:0 44px 0 14px;border-radius:12px;border:1px solid var(--border);background:var(--input);color:var(--text);font:500 14px var(--font);transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.control input::placeholder{color:#4B5878}
.control input:hover{border-color:rgba(148,163,255,.28)}
.control input:focus{outline:none;border-color:var(--border-active);box-shadow:0 0 0 4px rgba(34,211,238,.12)}
.control input.invalid{border-color:var(--danger);box-shadow:0 0 0 4px rgba(248,113,113,.12)}
.pw-toggle{position:absolute;right:6px;top:6px;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer}
.pw-toggle:hover{color:var(--text);background:rgba(148,163,255,.1)}
.error-msg{display:none;margin:2px 0 14px;padding:10px 12px;border-radius:10px;font-size:13px;color:#FCA5A5;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3)}
.error-msg.active{display:block;animation:rise .25s var(--ease)}
.btn{position:relative;width:100%;height:48px;border:0;border-radius:12px;cursor:pointer;font:600 15px var(--font);color:#031318;background:linear-gradient(120deg,var(--primary),#7DD3FC 60%,var(--secondary));box-shadow:0 8px 24px rgba(34,211,238,.25);transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(34,211,238,.35)}
.btn:active{transform:scale(.98)}
.btn.loading{pointer-events:none;opacity:.8}
.switch{margin-top:22px;text-align:center;font-size:13px}
.switch a{color:var(--muted);text-decoration:none}.switch a span{color:var(--primary);font-weight:600}
.switch a:hover span{text-decoration:underline}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.shake{animation:shake .4s var(--ease)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
#successOverlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;background:rgba(5,7,15,.92);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
#successOverlay.active{opacity:1;pointer-events:auto}
.success-ring{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid var(--primary);opacity:.5;animation:ring 1.1s var(--ease) infinite}
@keyframes ring{from{transform:scale(.6);opacity:.8}to{transform:scale(1.6);opacity:0}}
.success-mark{position:relative;font:700 26px var(--display)}
.success-sub{display:block;margin-top:6px;font:400 13px var(--mono);color:var(--muted)}
@media(max-width:820px){.shell{grid-template-columns:1fr}.visual{display:none}.panel{padding:32px 24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="shell">
  <aside class="visual" aria-hidden="true">
    <div class="brand"><i>&lt;/&gt;</i> CHRNS-DSA</div>
    <div class="graph"><svg viewBox="0 0 400 300"><g>
      <line x1="200" y1="40" x2="110" y2="120"/><line x1="200" y1="40" x2="290" y2="120"/><line x1="110" y1="120" x2="60" y2="210"/><line x1="110" y1="120" x2="160" y2="210"/><line x1="290" y1="120" x2="240" y2="210"/><line x1="290" y1="120" x2="340" y2="210"/><line x1="160" y1="210" x2="240" y2="210" stroke-dasharray="4 4"/>
      <circle cx="200" cy="40" r="11"/><circle class="b" cx="110" cy="120" r="9"/><circle class="b" cx="290" cy="120" r="9"/><circle cx="60" cy="210" r="7"/><circle cx="160" cy="210" r="7"/><circle cx="240" cy="210" r="7"/><circle cx="340" cy="210" r="7"/>
      <text x="216" y="36">root</text><text x="60" y="256">O(log n)</text><text x="290" y="256">O(n)</text></g></svg></div>
    <div><h2>Track your DSA<br><span>mastery.</span></h2><p>Sign in to continue to your practice tracker and contests.</p></div>
  </aside>
  <section class="panel">
    <h1 id="cardTitle">Welcome back</h1>
    <p class="sub" id="cardSubtitle">Sign in to continue to CHRNS-DSA</p>
    <form id="loginForm" >
      <div class="field"><label for="username">Username</label><div class="control"><input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required></div></div>
      <div class="field"><label for="password">Password</label><div class="control"><input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
      <div class="field" id="confirmGroup" style="display:none"><label for="confirmPassword">Confirm password</label><div class="control"><input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password"></div></div>
      <div class="error-msg" id="errorMsg" role="alert"></div>
      <button type="submit" class="btn" id="submitBtn"><span>Log in</span></button>
      <div class="switch"><a href="#" id="switchModeLink">Don't have an account? <span>Sign up</span></a></div>
    </form>
  </section>
</main>
<div id="successOverlay"><div class="success-ring"></div><div class="success-mark">CHRNS-DSA<span class="success-sub">Entering the arena…</span></div></div>
  <script src="dsa/js/storage.js"></script>
  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var mode = 'login';
      var confirmGroup = document.getElementById('confirmGroup');
      var confirmInput = document.getElementById('confirmPassword');
      var cardTitle = document.getElementById('cardTitle');
      var cardSubtitle = document.getElementById('cardSubtitle');
      var submitBtn = document.getElementById('submitBtn');
      var switchLink = document.getElementById('switchModeLink');
      var errorMsg = document.getElementById('errorMsg');
      var pwToggle = document.getElementById('pwToggle');
      pwToggle.addEventListener('click', function () { var p = document.getElementById('password'); var show = p.type === 'password'; p.type = show ? 'text' : 'password'; pwToggle.setAttribute('aria-pressed', show); });
      [document.getElementById('username'), document.getElementById('password'), confirmInput].forEach(function (el) { el.addEventListener('input', function () { errorMsg.classList.remove('active'); el.classList.remove('invalid'); }); });

      // If a session already exists, skip straight to the dashboard.
      try {
        if (StorageManager.getCurrentUserId()) {
          window.location.replace('dsa/index.html');
        }
      } catch (e) {}

      function setMode(next) {
        mode = next;
        errorMsg.classList.remove('active');
        errorMsg.textContent = '';
        if (mode === 'signup') {
          cardTitle.textContent = 'Create your account';
          cardSubtitle.textContent = 'Join CHRNS-DSA to track your progress';
          submitBtn.querySelector('span').textContent = 'Create account';
          confirmGroup.style.display = 'block';
          confirmInput.required = true;
          switchLink.innerHTML = 'Already have an account? <span>Log in</span>';
        } else {
          cardTitle.textContent = 'Welcome back';
          cardSubtitle.textContent = 'Sign in to continue to CHRNS-DSA';
          submitBtn.querySelector('span').textContent = 'Log in';
          confirmGroup.style.display = 'none';
          confirmInput.required = false;
          switchLink.innerHTML = "Don't have an account? <span>Sign up</span>";
        }
      }

      switchLink.addEventListener('click', function (e) {
        e.preventDefault();
        setMode(mode === 'login' ? 'signup' : 'login');
      });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorMsg.classList.remove('active');
        errorMsg.textContent = '';

        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        var confirm = confirmInput.value;

        try {
          if (mode === 'signup') {
            if (password !== confirm) throw new Error('Passwords do not match.');
            await StorageManager.registerUser(username, password);
          } else {
            await StorageManager.loginUser(username, password);
          }
          playSuccessAndEnter();
        } catch (err) {
          errorMsg.textContent = err.message;
          errorMsg.classList.add('active');
          (mode === 'signup' && /match/i.test(err.message) ? confirmInput : document.getElementById('password')).classList.add('invalid');
          form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
        }
      });

      function playSuccessAndEnter() {
        var overlay = document.getElementById('successOverlay');
        overlay.classList.add('active'); submitBtn.classList.add('loading');
        setTimeout(function () {
          window.location.href = 'dsa/index.html';
        }, 1100);
      }
    })();
  </script>

  
</body>
</html>
